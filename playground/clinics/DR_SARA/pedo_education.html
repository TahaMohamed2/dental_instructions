<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dental Instructions</title>
  <link rel="icon" href="resources/instructions_logo.ico" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="index_styles.css" />
  <script src="js/i18n.js" defer></script>
  <script src="js/site-loader.js" defer></script>
  <script src="QR_image_viewer.js" defer></script>
  <style>
    .topic-button { transition: all 0.3s ease; transform-style: preserve-3d; }
    .topic-button:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
    .topic-button.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .topic-info { opacity: 0; transform: translateY(-10px); transition: all 0.3s ease; height: 0; overflow: hidden; }
    .topic-info.show { opacity: 1; transform: translateY(0); height: auto; }
  </style>
</head>
<body data-page="pedo_education" class="bg-slate-800 text-slate-100 font-sans p-5 flex flex-col min-h-screen relative">
  <header id="site-header"></header>
  
  <main class="max-w-4xl mx-auto w-full flex-grow">
    <div class="text-center mb-8">
      <h1 id="main-title" class="text-3xl md:text-4xl font-bold text-white mb-2"></h1>
      <p class="text-slate-300">
          <span class="ar-only">برجاء اختيار الموضوع لمشاهدة التفاصيل</span>
          <span class="en-only" style="display:none;">Please select a topic to view details</span>
      </p>
    </div>

    <!-- Topic Buttons -->
    <div class="bg-slate-700 rounded-2xl shadow-xl p-6 mb-8">
      <div id="topic-buttons" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Buttons injected here -->
      </div>
    </div>

    <!-- Topic Information Display Area -->
    <div id="topicInfo" class="topic-info bg-slate-700 rounded-2xl shadow-xl p-6">
      <div class="text-center">
        <h3 id="topicTitle" class="text-2xl font-bold text-white mb-4"></h3>
        <div id="topicContent" class="text-right text-slate-200 leading-relaxed whitespace-pre-line" dir="auto"></div>
      </div>
    </div>
  </main>
  
  <footer id="site-footer"></footer>
  
  <script>
    function renderPedoEducation() {
        if (!window.instructionsData || !window.instructionsData.pedo_education) return;
        const data = window.instructionsData.pedo_education;
        const lang = window.i18n ? window.i18n.getLanguage() : 'ar';
        
        document.getElementById('main-title').textContent = lang === 'ar' ? data.title_ar : (data.title_en || data.title_ar);
        
        const container = document.getElementById('topic-buttons');
        let html = '';
        data.topics.forEach((t, i) => {
            const btnLabel = lang === 'ar' ? t.button_label_ar : (t.button_label_en || t.button_label_ar);
            html += `<button onclick="showTopicInfo(${i})" class="topic-button bg-blue-600 text-white px-4 py-3 rounded-lg font-medium">${btnLabel}</button>`;
        });
        container.innerHTML = html;
        
        // Re-render open topic if any
        const activeBtn = document.querySelector('.topic-button.active');
        if (activeBtn) {
            const index = Array.from(container.children).indexOf(activeBtn);
            if(index >= 0) showTopicInfo(index);
        }
    }

    window.showTopicInfo = function(index) {
        if (!window.instructionsData || !window.instructionsData.pedo_education) return;
        const data = window.instructionsData.pedo_education;
        const lang = window.i18n ? window.i18n.getLanguage() : 'ar';
        const topic = data.topics[index];
        
        document.getElementById('topicTitle').textContent = lang === 'ar' ? topic.title_ar : (topic.title_en || topic.title_ar);
        document.getElementById('topicContent').textContent = lang === 'ar' ? topic.content_ar : (topic.content_en || topic.content_ar);
        
        const buttons = document.querySelectorAll('.topic-button');
        buttons.forEach(b => b.classList.remove('active'));
        if(buttons[index]) buttons[index].classList.add('active');
        
        const topicInfo = document.getElementById('topicInfo');
        topicInfo.classList.add('show');
        topicInfo.scrollIntoView({ behavior: 'smooth' });
    };

    document.addEventListener('click', function(e) {
      const topicInfo = document.getElementById('topicInfo');
      const topicButtons = document.querySelectorAll('.topic-button');
      
      if (!topicInfo.contains(e.target) && 
          !Array.from(topicButtons).some(btn => btn.contains(e.target)) &&
          topicInfo.classList.contains('show')) {
        topicInfo.classList.remove('show');
        const activeBtn = document.querySelector('.topic-button.active');
        if (activeBtn) activeBtn.classList.remove('active');
      }
    });

    window.addEventListener('languageChanged', renderPedoEducation);
    
    const interval = setInterval(() => {
        if (window.instructionsData) {
            clearInterval(interval);
            renderPedoEducation();
            
            // disable default page renderer from site-loader since we do it here
            document.body.dataset.page = "";
        }
    }, 100);
  </script>
</body>
</html>
