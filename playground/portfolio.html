<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio</title>
    <link rel="icon" href="resources/instructions_logo.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="index_styles.css" />
    <script src="js/i18n.js" defer></script>
    <script src="js/site-loader.js" defer></script>
    <script src="QR_image_viewer.js" defer></script>

<body data-page="portfolio" class="bg-slate-800 text-slate-100 font-sans p-5 flex flex-col min-h-screen relative">

    <main id="page-content" class="max-w-6xl mx-auto w-full flex-grow">

        <div class="flex justify-center items-center h-64">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-teal-500"></div>
        </div>

    <footer id="site-footer"></footer>
</body>
</html>
