<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">توعية للأطفال</title>

    <!-- Favicon -->
    <link rel="icon" href="resources/instructions_logo.ico" id="favicon" type="image/x-icon">

    <!-- Embedded Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css" id="custom-styles">

    <!-- JavaScript Libraries -->
    <script src="QR_image_viewer.js" id="qr-viewer-script"></script>
    <script src="templates/style_injector.js"></script>
    <script src="templates/asset_manager.js"></script>
</head>
<body class="bg-slate-800 text-slate-100 font-sans p-5 flex flex-col min-h-screen relative">
    <!-- Navigation Buttons -->
    <button id="qr-button" onclick="viewQRImage()" class="absolute bottom-5 left-5 bg-transparent border-none rounded-lg p-1 text-lg cursor-pointer transition-all duration-300 w-12 text-slate-100">
        <img id="qr-image" alt="QR" class="max-w-full rounded-lg shadow-lg" />
    </button>

    <button id="credits-button" onclick="location.href='credits.html'" class="absolute bottom-5 right-5 bg-gray-600 text-slate-100 text-xs border-none rounded-lg px-2 py-1 cursor-pointer transition-all duration-300 shadow-lg hover:bg-gray-500">credits</button>

    <button id="home-button" onclick="window.location.href='index.html'" class="absolute top-5 right-5 bg-gray-600 text-slate-100 text-xs border-none rounded-lg px-2 py-1 cursor-pointer transition-all duration-300 shadow-lg hover:bg-gray-500">الرئيسية</button>

    <!-- Main Content Container -->
    <div class="max-w-4xl mx-auto">
        <!-- Page Title -->
        <h1 id="instruction-title" class="text-4xl font-bold text-center mb-8 text-white">توعية للأطفال</h1>

        <!-- Content Area -->
        <div id="content-area" class="space-y-4"><p class="mb-4 text-slate-200 leading-relaxed">برجاء اختيار الموضوع لمشاهدة التفاصيل</p></div>
    </div>

    <!-- JavaScript for Content Loading -->
    <script>
        // Configuration object that will be populated by the CMS
        const siteConfig = {
            instructionType: '',
            siteVersion: '',
            cssFramework: '',
            assets: {}
        };

        // Initialize the page
        document.addEventListener('DOMContentLoaded', async function() {
            // Get instruction type from URL or default
            const urlParams = new URLSearchParams(window.location.search);
            const instructionType = urlParams.get('type') || 'bleaching';

            // Load site configuration
            loadSiteConfiguration(instructionType);

            // Content is already embedded in HTML, just apply styling
            console.log('Content already embedded, applying styling only');
        });

        // Load site configuration based on current site version
        function loadSiteConfiguration(instructionType) {
            // This will be replaced by the actual configuration loading
            const currentPath = window.location.pathname;
            const isDrTaha = currentPath.includes('dr_taha');
            const isPlayground = currentPath.includes('playground');

            if (isDrTaha || isPlayground) {
                siteConfig.cssFramework = 'tailwind';
                siteConfig.siteVersion = isDrTaha ? 'dr_taha' : 'playground';
            } else {
                siteConfig.cssFramework = 'basic';
                siteConfig.siteVersion = 'root';
            }

            // Load assets
            loadAssets(siteConfig.siteVersion);
        }

        // Load site-specific assets
        async function loadAssets(siteVersion) {
            try {
                // Initialize asset manager with site version
                if (window.AssetManager) {
                    await window.AssetManager.initializeAssets(siteVersion);
                }

                // Apply styling using StyleInjector
                if (window.StyleInjector) {
                    await window.StyleInjector.loadFramework(siteConfig.cssFramework);
                    window.StyleInjector.applyResponsiveClasses(siteConfig.cssFramework);
                    window.StyleInjector.applyButtonStyles(siteConfig.cssFramework);
                    window.StyleInjector.applyContentStyles(siteConfig.cssFramework);
                }

            } catch (error) {
                console.error('Error loading assets:', error);
            }
        }
    </script>
</body>
</html>
